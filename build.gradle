plugins {
	// 26.1 起改用新版 Loom 插件：不 remap Minecraft 与 mod，也不再需要 mappings 声明
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.gradleup.shadow' version "9.0.0-beta13"
	id "com.diffplug.spotless" version "8.1.0"
}
loom {
	accessWidenerPath = file("src/main/resources/overrideList.accesswidener")
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	gradlePluginPortal()
	mavenLocal()
	mavenCentral()

	// 本地映射仓库：自建 yarn 映射以 Maven 坐标形式引用（me.matl114:yarn-special）。
	// mavenLocal() 会强制查找 POM，而该 artifact 只有 jar；用 artifact() 元数据源跳过 POM 查找。
	maven {
		name = 'localM2Artifacts'
		url = uri("${System.getProperty('user.home')}/.m2/repository")
		metadataSources { artifact() }
	}

	maven {
		url 'https://maven.aliyun.com/nexus/content/groups/public'
	}
	maven {
		url 'https://repository.hanbings.io/proxy'
	}
	maven {
		url 'https://jitpack.io'
	}
	maven {
		url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots'
	}
	maven {
		url "https://maven.meteordev.org/snapshots"
	}
	maven {
		url = "https://maven.meteordev.org/releases"
	}
}
sourceSets {
	stubs{
		compileClasspath += configurations.runtimeClasspath
	}
}
//apply plugin: 'com.gradleup.shadow'
//apply plugin: 'java'

fabricApi {
	configureDataGeneration()
}
configurations {
	//buildtoolsImplementation.extendsFrom(compileClasspath)
	runtimeClasspath.extendsFrom implementation
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft ("com.mojang:minecraft:${project.minecraft_version}"){
		transitive = false
	}
	// 26.1 起 Minecraft 官方 jar 不再混淆，无需任何 mappings 声明
	// 新版 Loom 不再 remap，modImplementation / modCompileOnly 已移除，改用标准 configuration
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	compileOnly files("libs/baritone-meteor-26.2.jar")
//	compileOnly files("libs/xaeroworldmap-fabric-26.2-1.41.0.jar")
//	compileOnly files("libs/xaerominimap-fabric-26.2-26.1.0.jar")
//	compileOnly files("libs/XaeroPlus-2.32.1+fabric-26.2-WM1.41.0-MM26.1.0.jar")
	compileOnly "meteordevelopment:meteor-client:${project.meteor_version}"

	// bridge
	// 原为 sourceSets.stubs.output：它同时包含 build/classes/java/stubs 与 build/resources/stubs。
	// 而 stubs 源集没有资源（processStubsResources 为 NO-SOURCE），该资源目录始终不存在，
	// 于是 compileClasspath 混入一个无效条目，Loom 的 migrateMappings 因 JDT classpath 校验失败
	// 报 "invalid environment settings"。改为只引用 classesDirs。
	compileOnly sourceSets.stubs.output.classesDirs
	// api
	api 'com.github.houbb:pinyin:0.4.0'  // 拼音
	api 'io.netty:netty-handler-proxy:4.1.97.Final' // proxy
	api 'org.yaml:snakeyaml:1.30' // yml

	// annotations
	compileOnly 'org.projectlombok:lombok:1.18.48'
	compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
	annotationProcessor 'org.projectlombok:lombok:1.18.48'


}

shadowJar {
	minimize()
	archiveFileName = "${project.properties["archives_base_name"]}-${project.version}.jar"
	configurations = [project.configurations.runtimeClasspath]
	dependencies {
		include dependency('com.github.houbb:.*')
		include dependency('io.netty:netty-handler.*:.*')
		include dependency('io.netty:netty-codec.*:.*')
		include dependency('org.yaml:snakeyaml:.*')
		exclude "mappings/mappings.tiny"
	}
}

spotless {
	lineEndings = 'WINDOWS'

	java {
		// 使用 PalantirJavaFormat（更简单，不需要配置文件）
		palantirJavaFormat('2.38.0')
				.style('PALANTIR')

		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

//loom {
//	// 禁用自动下载
//	skipDownloadAssets = true
//	skipDownloadMcLibraries = true
//
////	// 或者设置自定义缓存路径
////	customMinecraftCache = file("${project.gradle.gradleUserHomeDir}/caches/fabric-loom")
//}

// 新版 Loom 不再 remap，remapJar 任务已不存在，产物由 shadowJar 直接输出

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version

	filesMatching("fabric.mod.json") {
		expand (
			"version": project.version,
			"minecraft_version": project.minecraft_version
		)


	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	options.annotationProcessorPath = configurations.annotationProcessor
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
