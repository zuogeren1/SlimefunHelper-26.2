jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}

}
tasks.named("runClient", JavaExec) {
	jvmArgs("-XX:+AllowEnhancedClassRedefinition", "-XX:-OmitStackTraceInFastThrow"
			, "-Dmixin.debug.export=true"
			, "-Xmx6G", "-Xms3G"
	)
	systemProperties = [
			"https.proxyHost": "127.0.0.1",
			"https.proxyPort": "7890",
			"http.proxyHost": "127.0.0.1",
			"http.proxyPort": "7890"
	]
}
