# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx6G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
# 26.1 起 Minecraft 不再混淆，无 yarn/intermediary 映射，Loom 也不再需要 mappings 声明
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
# 每个 MC 版本的差异（minecraft_version / fabric_api_version / baritone_jar ...）
# 放在 versions/<mc版本>/gradle.properties 里，由共同构建脚本 common.gradle 读取
mod_id=slimefunhelper
mod_name=SlimefunHelper
mod_version=1.1.7.1
maven_group=me.matl114
archives_base_name=SlimefunHelper

# Dependencies
meteor_version=26.2-SNAPSHOT
